name: Ruff baseline audit (temporary, read-only)

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - chore/platform-api-ruff-baseline-20261031

permissions:
  contents: read

jobs:
  gather-safe-edits:
    name: Collect Ruff-safe changes for code review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Ruff fixes in disposable workspace and report changes
        run: |
          set -euo pipefail
          python -m pip install ruff==0.8.4
          cd platform-api
          python -m ruff check --fix app tests || true
          python -m ruff format app tests
          python -m ruff check --fix app tests || true
          python -m ruff check app tests --output-format json > ../ruff-audit.json || true
          cd ..
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          errors = json.loads(Path("ruff-audit.json").read_text(encoding="utf-8"))
          counts = {}
          for error in errors:
              code = error["code"]
              counts[code] = counts.get(code, 0) + 1
          print("RUFF_AUDIT_SUMMARY:" + json.dumps({"remaining": counts}, sort_keys=True), flush=True)
          changes = subprocess.check_output(
              ["git", "diff", "--name-only", "--", "platform-api/app", "platform-api/tests"],
              text=True,
          ).splitlines()
          for name in changes:
              data = Path(name).read_text(encoding="utf-8")
              for part, offset in enumerate(range(0, len(data), 1800)):
                  print(
                      "RUFF_AUDIT_DATA:" +
                      json.dumps(
                          {"path": name, "part": part, "text": data[offset:offset + 1800]},
                          ensure_ascii=True,
                          separators=(",", ":"),
                      ),
                      flush=True,
                  )
          print("RUFF_AUDIT_END:" + json.dumps({"files": len(changes)}), flush=True)
          PY
