name: Cache default binaries (read-only validation)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        type: choice
        options: [amd64, arm64]
        default: amd64

permissions:
  contents: read

jobs:
  validate:
    name: Download and verify upstream binaries without repository writes
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: ./.github/actions/prepare-binaries
        with:
          mode: release
          arch: ${{ inputs.arch }}
      - name: Upload verified download artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k8s-release-validation-${{ inputs.arch }}-${{ github.run_number }}
          path: |
            files/${{ inputs.arch }}/
            inventories/group_vars/download-checksums-${{ inputs.arch }}.yml
          retention-days: 14
          if-no-files-found: error
