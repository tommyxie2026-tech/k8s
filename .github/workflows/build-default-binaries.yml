name: Build default binaries (read-only validation)

on:
  pull_request:
    paths:
      - .github/workflows/build-default-binaries.yml
      - .github/actions/prepare-binaries/**
      - repo/sources.yml
      - scripts/build-default-binaries.sh
      - scripts/package-built-binaries.sh
      - scripts/verify-binary-cache.sh
      - scripts/write-sha256sums.sh
      - scripts/generate-download-checksums.py
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        type: choice
        options: [amd64, arm64]
        default: amd64
      stage:
        description: Build stage
        type: choice
        options: [stage1-light, stage2-core, stage3-runtime, stage4-kubernetes, custom, all]
        default: stage1-light
      components:
        description: Comma-separated components for custom stage
        type: string
        default: ''
      restore_cache:
        description: Read existing binary-cache branch without writing to it
        type: boolean
        default: false
      strict_package:
        description: Require all deploy artifacts; use stage=all or restore a complete cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: binary-source-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build and verify without repository write access
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: ./.github/actions/prepare-binaries
        with:
          mode: source
          arch: ${{ inputs.arch || 'amd64' }}
          stage: ${{ inputs.stage || 'stage1-light' }}
          components: ${{ inputs.components || '' }}
          restore_cache: ${{ inputs.restore_cache || false }}
          strict_package: ${{ inputs.strict_package || false }}
      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k8s-source-validation-${{ inputs.arch || 'amd64' }}-${{ github.run_number }}
          path: |
            files/${{ inputs.arch || 'amd64' }}/
            inventories/group_vars/download-checksums-${{ inputs.arch || 'amd64' }}.yml
          retention-days: 14
          if-no-files-found: error
