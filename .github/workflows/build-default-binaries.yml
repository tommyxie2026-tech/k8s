name: Build default binaries (read-only validation)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        type: choice
        options: [amd64, arm64]
        default: amd64
      stage:
        description: Build stage
        type: choice
        options: [stage1-light, stage2-core, stage3-runtime, stage4-kubernetes, custom, all]
        default: stage1-light
      components:
        description: Comma-separated components for custom stage
        type: string
        default: ''
      restore_cache:
        description: Read existing binary-cache branch without writing to it
        type: boolean
        default: false
      strict_package:
        description: Require all deploy artifacts; use stage=all or restore a complete cache
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Build and verify without repository write access
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: true
      - uses: ./.github/actions/prepare-binaries
        with:
          mode: source
          arch: ${{ inputs.arch }}
          stage: ${{ inputs.stage }}
          components: ${{ inputs.components }}
          restore_cache: ${{ inputs.restore_cache }}
          strict_package: ${{ inputs.strict_package }}
      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k8s-source-validation-${{ inputs.arch }}-${{ github.run_number }}
          path: |
            files/${{ inputs.arch }}/
            inventories/group_vars/download-checksums-${{ inputs.arch }}.yml
          retention-days: 14
          if-no-files-found: error
