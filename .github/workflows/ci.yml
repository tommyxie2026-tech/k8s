name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  workflow-lint:
    name: GitHub Actions workflow static validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install pinned actionlint and check all workflows
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  script-syntax:
    name: Script syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | while IFS= read -r -d '' script; do
            echo "==> bash -n ${script}"
            bash -n "${script}"
          done

  source-manifest:
    name: Source manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate source manifest
        run: python scripts/validate-source-manifest.py

  version-consistency:
    name: Version consistency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Check source and deploy versions
        run: python scripts/check-version-consistency.py

      - name: Validate pinned Go toolchain against upstream component requirements
        run: python scripts/check-go-toolchain.py

      - name: Test binary delivery integrity and permission boundaries
        run: python scripts/test-binary-delivery.py

  ansible-syntax-container:
    name: Ansible syntax checks - container inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Show Ansible version
        run: ansible --version

      - name: Syntax check playbooks with container inventory
        run: INVENTORY=inventories/hosts-container.yml bash scripts/syntax-check.sh

  ansible-syntax-single:
    name: Ansible syntax checks - single-node inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Show Ansible version
        run: ansible --version

      - name: Syntax check playbooks with single-node inventory
        run: INVENTORY=inventories/hosts-single.yml bash scripts/syntax-check.sh

  platform-api-contract:
    name: M3-0 Platform API contract and runtime safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: platform-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint M3-0 regression tests
        run: python -m ruff check tests/test_m3_0_contract_baseline.py

      - name: Verify M3-0 and existing runtime/architecture contracts
        run: |
          python -m pytest -q -rx \
            tests/test_m3_0_contract_baseline.py \
            tests/test_runtime_service.py \
            tests/test_runtime_worker.py \
            tests/test_workflow_service.py \
            tests/test_workflow_safety.py \
            tests/test_architecture.py \
            tests/test_architecture_boundaries.py \
            tests/test_architecture_dependencies.py
